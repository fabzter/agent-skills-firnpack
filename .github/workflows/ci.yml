name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: root copy is byte-identical to the pinned engine
        run: cmp firnpack.py firnpack/firnpack.py
      - name: skill contract matches the engine surface
        run: |
          python -m pip install pytest
          python -m pytest tests/ -q
      - name: the engine suite passes against the copy
        run: |
          cp firnpack.py firnpack/firnpack.py
          cd firnpack
          python -m pytest tests/ -q
